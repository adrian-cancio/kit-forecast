[package]
name = "kit-forecast"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust port of KiT, a flow-matching diffusion transformer that forecasts candlestick (K-line) time series"
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["forecasting", "time-series", "diffusion", "candle", "finance"]
categories = ["science", "mathematics"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/tools/parity/*.py",
    "/tools/parity/README.md",
    "/tools/fixtures/*.py",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
hf-hub = { version = "1", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "8", default-features = false }


[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
hf-hub = ["dep:hf-hub"]

[dev-dependencies]
safetensors = "0.7"

[[bench]]
name = "forecast"
harness = false
